[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimind-o-action"
version = "0.1.0"
description = "A small from-scratch vision-language agent for MiniWoB++ GUI actions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MiniMind-O Action contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "torch>=2.1,<2.6",
    "transformers>=4.40,<5.2",
    "safetensors>=0.4,<0.8",
    "numpy>=1.24,<2.0",
    "PyYAML>=6.0,<7.0",
    "Pillow>=10.0",
    "filelock>=3.12",
]

[project.optional-dependencies]
eval = ["gymnasium>=0.29", "browsergym>=0.14", "playwright>=1.40"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["agent", "configs", "eval", "legacy", "models", "scripts", "scripts.lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
